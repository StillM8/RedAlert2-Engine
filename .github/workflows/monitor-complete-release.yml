name: Monitor completed release publishing

on:
  push:
    branches:
      - main
    paths:
      - .github/complete-release-monitor.txt

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Locate latest completion run
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 5
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow complete-release.yml --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [[ -z "$RUN_ID" ]]; then
            printf '{"status":"no-run-found"}\n' > .github/complete-release-run-status.json
          else
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url,headSha,event,createdAt,updatedAt > .github/complete-release-run-status.json
          fi

      - name: Commit active status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/complete-release-run-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record active release publishing run"
            git push origin HEAD:main
          fi

      - name: Watch completion run
        if: steps.locate.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
        run: gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --interval 10 --exit-status || true

      - name: Refresh final status
        if: steps.locate.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
        run: gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url,headSha,event,createdAt,updatedAt > .github/complete-release-run-status.json

      - name: Commit final status
        if: steps.locate.outputs.run_id != ''
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/complete-release-run-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record completed release publishing run"
            git push origin HEAD:main
          fi
