name: Build macOS desktop beta

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  macos-universal:
    name: macOS universal (Apple Silicon + Intel)
    runs-on: macos-15
    defaults:
      run:
        working-directory: redalert2
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Set up Rust with both macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build unsigned universal macOS bundle
        run: bun run tauri:build -- --target universal-apple-darwin --ci --no-sign

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: redalert2-macos-universal-beta
          if-no-files-found: error
          path: redalert2/src-tauri/target/universal-apple-darwin/release/bundle
