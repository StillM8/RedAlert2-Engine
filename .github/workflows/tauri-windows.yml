name: Build Windows desktop beta

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows portable EXE (MSVC)
    runs-on: windows-2025
    defaults:
      run:
        working-directory: redalert2
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Set up Rust MSVC target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build portable single-file EXE
        run: bun run tauri:build -- --target x86_64-pc-windows-msvc --ci --no-bundle

      - name: Verify WebView2 loader is statically linked
        shell: pwsh
        run: |
          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/redalert2-desktop.exe"
          $loader = "src-tauri/target/x86_64-pc-windows-msvc/release/WebView2Loader.dll"
          if (-not (Test-Path $exe)) {
            throw "Expected EXE was not produced: $exe"
          }
          if (Test-Path $loader) {
            throw "The MSVC build unexpectedly produced a separate WebView2Loader.dll"
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: redalert2-windows-single-exe-beta
          if-no-files-found: error
          path: redalert2/src-tauri/target/x86_64-pc-windows-msvc/release/redalert2-desktop.exe
