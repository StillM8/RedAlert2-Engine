name: Complete engine release

on:
  push:
    branches:
      - main
    paths:
      - .github/complete-release-trigger.txt

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish completed cross-platform release
    runs-on: ubuntu-22.04
    env:
      SOURCE_SHA: 61207a35529ea7a72e6399fe6177dcdd09d91673
      SOURCE_RUN_ID: "32163451383"
      RELEASE_VERSION: 0.1.0-beta.1
      RELEASE_TAG: engine-v0.1.0-beta.1
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install web dependencies
        working-directory: redalert2
        run: bun install --frozen-lockfile

      - name: Set Android release version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          text = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {os.environ["GITHUB_RUN_NUMBER"]}', text, count=1)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{os.environ["RELEASE_VERSION"]}"', text, count=1)
          path.write_text(text)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build unsigned Android release APK
        env:
          GRADLE_BIN: gradle
        run: ./scripts/build-android.sh --release

      - name: Collect successful desktop artifacts from original release run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets downloaded
          for artifact in engine-windows-x64 engine-macos-arm64 engine-macos-x64 engine-linux-x64; do
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "downloaded/$artifact"
            find "downloaded/$artifact" -type f -maxdepth 3 -exec cp {} release-assets/ \;
          done

          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          [[ -f "$UNSIGNED" ]] || { echo "::error::Unsigned Android release APK not found"; exit 1; }
          cp "$UNSIGNED" "release-assets/Open-RTS-Engine-${RELEASE_VERSION}-android-unsigned.apk"

          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub prerelease and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' ASSETS < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" <<'EOF'
          Cross-platform Open RTS Engine build from `main`.

          Included:
          - Windows x64 portable executable
          - Linux x64 packages/portable archive
          - macOS Apple Silicon (ARM64) DMG and app archive
          - macOS Intel (x64) DMG and app archive
          - Android release APK (unsigned because repository Android signing secrets are not configured yet)
          - SHA-256 checksums

          The Android APK must be signed before normal installation/distribution. Configure the `ANDROID_RELEASE_*` repository secrets for signed Android releases.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Open RTS Engine $RELEASE_VERSION" --prerelease --notes-file "$NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Open RTS Engine $RELEASE_VERSION" --prerelease --notes-file "$NOTES_FILE"
          fi

          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Record completion status
        shell: bash
        run: |
          set -euo pipefail
          printf '{"release":"%s","status":"published","sourceSha":"%s","sourceRunId":%s}\n' "$RELEASE_TAG" "$SOURCE_SHA" "$SOURCE_RUN_ID" > .github/complete-release-status.json
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/complete-release-status.json
          git commit -m "Record published engine release" || exit 0
          git push origin main
