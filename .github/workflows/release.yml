name: Build Red Alert 2 all platforms

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or SHA to build
        required: true
        type: string
        default: beta
      publish_release:
        description: Publish/update a GitHub Release after building
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark a manually published GitHub Release as a prerelease
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "ra2-v*"
      - "engine-v*"

permissions:
  contents: read

concurrency:
  group: ra2-all-platforms-${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.10"
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve build source
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish_release: ${{ steps.release.outputs.publish_release }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
          fetch-depth: 0

      - id: release
        name: Resolve version and publishing mode
        shell: bash
        env:
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
          MANUAL_PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("redalert2/src-tauri/tauri.conf.json"))["version"])')"
          SOURCE_SHA="$(git rev-parse HEAD)"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" != "ra2-v${VERSION}" && "$TAG" != "engine-v${VERSION}" ]]; then
              echo "::error::Tag $TAG does not match engine version $VERSION"
              exit 1
            fi
            PUBLISH_RELEASE=true
            [[ "$VERSION" == *-* ]] && PRERELEASE=true || PRERELEASE=false
          else
            TAG="engine-v${VERSION}"
            PUBLISH_RELEASE="${MANUAL_PUBLISH:-false}"
            PRERELEASE="${MANUAL_PRERELEASE:-true}"
            [[ "$VERSION" == *-* ]] && PRERELEASE=true
          fi

          {
            echo "source_sha=$SOURCE_SHA"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "publish_release=$PUBLISH_RELEASE"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate once + build frontend once
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: redalert2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('redalert2/bun.lock') }}

      - run: bun install --frozen-lockfile
      - name: Full test suite
        run: bun test
      - name: Entry typecheck
        run: bun run typecheck:entry
      - name: Production web build
        run: bun run build

      - name: Upload validated frontend
        uses: actions/upload-artifact@v4
        with:
          name: release-web-dist
          path: redalert2/dist
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android APK
    needs: [prepare, validate]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download validated frontend
        uses: actions/download-artifact@v4
        with:
          name: release-web-dist
          path: redalert2/dist

      - name: Configure Android build version and signer
        id: android-config
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish_release }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if [[ "$configured" -ne 0 && "$configured" -ne 4 ]]; then
            echo "::error::Set all four ANDROID_RELEASE_* secrets or none of them."
            exit 1
          fi
          if [[ "$PUBLISH_RELEASE" == "true" && "$configured" -ne 4 ]]; then
            echo "::error::Published/tagged releases require all four ANDROID_RELEASE_* signing secrets."
            exit 1
          fi
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            echo "mode=production" >> "$GITHUB_OUTPUT"
          else
            echo "mode=development" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Stage Android WebView assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/WebDist
          mkdir -p android/app/src/main/assets
          cp -R redalert2/dist android/app/src/main/assets/WebDist
          rm -rf android/app/src/main/assets/GameRes
          mkdir -p android/app/src/main/assets/GameRes

      - name: Assemble release APK
        working-directory: android
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: gradle --no-daemon :app:assembleRelease -PreleaseVersionCode="$GITHUB_RUN_NUMBER" -PreleaseVersionName="$RELEASE_VERSION"

      - name: Package and verify installable APK
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SIGNING_MODE: ${{ steps.android-config.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ "$SIGNING_MODE" == "production" ]]; then
            OUTPUT="release-assets/Red-Alert-2-${RELEASE_VERSION}-android.apk"
          else
            OUTPUT="release-assets/Red-Alert-2-${RELEASE_VERSION}-DEVELOPMENT-${GITHUB_RUN_NUMBER}-android.apk"
          fi

          if [[ "$SIGNING_MODE" == "production" ]]; then
            [[ -f "$UNSIGNED" ]] || { echo "::error::Unsigned production APK missing"; exit 1; }
            KEYSTORE="$RUNNER_TEMP/ra2-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            ALIGNED="$RUNNER_TEMP/ra2-aligned.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" --out "$OUTPUT" "$ALIGNED"
          elif [[ -f "$UNSIGNED" ]]; then
            echo "Development APK: unsuitable for the production update line."
            KEYSTORE="$RUNNER_TEMP/ra2-temporary-dev.keystore"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass android -keypass android -alias ra2-dev -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Red Alert 2 Development Build,O=StillM8,C=PK"
            ALIGNED="$RUNNER_TEMP/ra2-temp-aligned.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias ra2-dev --ks-pass pass:android --key-pass pass:android --out "$OUTPUT" "$ALIGNED"
          else
            echo "::error::Gradle did not produce a release APK"
            exit 1
          fi

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT"
          "$BUILD_TOOLS/zipalign" -c -p 4 "$OUTPUT"
          test -s "$OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ra2-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64 EXEs
    needs: [prepare, validate]
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: redalert2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('redalert2/bun.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo and compiled Tauri target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            redalert2/src-tauri/target
          key: cargo-windows-x64-${{ hashFiles('redalert2/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-x64-

      - run: bun install --frozen-lockfile

      - name: Download validated frontend
        uses: actions/download-artifact@v4
        with:
          name: release-web-dist
          path: redalert2/dist

      - name: Configure Windows production signing
        id: windows-signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish_release }}
        run: |
          $values = @($env:WINDOWS_SIGNING_CERTIFICATE_BASE64, $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          $configured = @($values | Where-Object { $_ -and $_.Length -gt 0 }).Count
          if ($configured -ne 0 -and $configured -ne 2) {
            throw "Set both WINDOWS_SIGNING_CERTIFICATE_* secrets or neither."
          }
          if ($env:PUBLISH_RELEASE -eq "true" -and $configured -ne 2) {
            throw "Published releases require Windows Authenticode signing secrets."
          }
          if ($configured -eq 2) {
            "mode=production" >> $env:GITHUB_OUTPUT
          }
          else {
            "mode=development" >> $env:GITHUB_OUTPUT
          }

      - name: Build portable executable and NSIS installer
        run: bun run tauri:build -- --config ../.github/tauri-ci.conf.json --target x86_64-pc-windows-msvc --ci --bundles nsis

      - name: Collect Windows executables
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          WINDOWS_SIGNING_MODE: ${{ steps.windows-signing.outputs.mode }}
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $portable = "src-tauri/target/x86_64-pc-windows-msvc/release/redalert2-desktop.exe"
          $installer = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter *.exe -File | Select-Object -First 1
          if (-not (Test-Path $portable)) { throw "Portable Windows executable missing" }
          if (-not $installer) { throw "NSIS setup executable missing" }
          if ((Get-Item $portable).Length -le 0 -or $installer.Length -le 0) { throw "Windows executable is empty" }
          if ($env:WINDOWS_SIGNING_MODE -eq "production") {
            $certificate = Join-Path $env:RUNNER_TEMP "ra2-release-signing.pfx"
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
            if (-not $signtool) { throw "Windows SDK signtool.exe was not found" }
            foreach ($path in @($portable, $installer.FullName)) {
              & $signtool.FullName sign /fd SHA256 /f $certificate /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 $path
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $path" }
              & $signtool.FullName verify /pa $path
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $path" }
            }
          }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $portable "release-assets/Red-Alert-2-$env:RELEASE_VERSION-windows-x64-portable.exe"
          Copy-Item $installer.FullName "release-assets/Red-Alert-2-$env:RELEASE_VERSION-windows-x64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ra2-windows-x64
          path: redalert2/release-assets/*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.arch }} DMG + App
    needs: [prepare, validate]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: redalert2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('redalert2/bun.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo and compiled Tauri target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            redalert2/src-tauri/target
          key: cargo-macos-${{ matrix.arch }}-${{ hashFiles('redalert2/src-tauri/Cargo.lock') }}
          restore-keys: cargo-macos-${{ matrix.arch }}-

      - run: bun install --frozen-lockfile

      - name: Download validated frontend
        uses: actions/download-artifact@v4
        with:
          name: release-web-dist
          path: redalert2/dist

      - name: Configure macOS signing
        id: macos-signing
        shell: bash
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish_release }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$MACOS_SIGNING_CERTIFICATE_BASE64" "$MACOS_SIGNING_CERTIFICATE_PASSWORD" "$MACOS_SIGNING_IDENTITY"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if [[ "$configured" -ne 0 && "$configured" -ne 3 ]]; then
            echo "::error::Set all MACOS_SIGNING_* secrets or none of them."
            exit 1
          fi
          if [[ "$PUBLISH_RELEASE" == "true" && "$configured" -ne 3 ]]; then
            echo "::error::Published releases require macOS Developer ID signing secrets."
            exit 1
          fi
          if [[ "$configured" -eq 3 ]]; then
            CERTIFICATE="$RUNNER_TEMP/ra2-release-signing.p12"
            KEYCHAIN="$RUNNER_TEMP/ra2-release-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            printf '%s' "$MACOS_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            echo "mode=production" >> "$GITHUB_OUTPUT"
          else
            echo "mode=development" >> "$GITHUB_OUTPUT"
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path('src-tauri/tauri.conf.json')
          cfg = json.loads(p.read_text())
          identity = os.environ.get('MACOS_SIGNING_IDENTITY') or '-'
          cfg.setdefault('bundle', {}).setdefault('macOS', {})['signingIdentity'] = identity
          p.write_text(json.dumps(cfg, indent=2) + '\n')
          PY

      - name: Build DMG and application bundle
        run: bun run tauri:build -- --config ../.github/tauri-ci.conf.json --target ${{ matrix.target }} --ci --bundles app,dmg

      - name: Verify and collect macOS artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          MACOS_SIGNING_MODE: ${{ steps.macos-signing.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          DMG="$(find "src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          APP="$(find "src-tauri/target/$TARGET/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -f "$DMG" ]] || { echo "::error::macOS DMG missing"; exit 1; }
          [[ -d "$APP" ]] || { echo "::error::macOS app bundle missing"; exit 1; }
          codesign --verify --deep --strict "$APP"
          BINARY="$APP/Contents/MacOS/redalert2-desktop"
          [[ -x "$BINARY" ]] || { echo "::error::macOS app executable missing"; exit 1; }
          ARCHES="$(lipo -archs "$BINARY")"
          grep -qw "$ARCH" <<< "$ARCHES" || { echo "::error::Expected $ARCH executable, got $ARCHES"; exit 1; }
          [[ "$MACOS_SIGNING_MODE" != "production" || "$(codesign -dv --verbose=4 "$APP" 2>&1 | grep -c 'Authority=Developer ID Application' || true)" -gt 0 ]] || { echo "::error::Production macOS app is not Developer ID signed"; exit 1; }
          cp "$DMG" "release-assets/Red-Alert-2-${RELEASE_VERSION}-macOS-${ARCH}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-assets/Red-Alert-2-${RELEASE_VERSION}-macOS-${ARCH}.app.zip"
          [[ -s "release-assets/Red-Alert-2-${RELEASE_VERSION}-macOS-${ARCH}.dmg" ]] || { echo "::error::macOS DMG is empty"; exit 1; }
          [[ -s "release-assets/Red-Alert-2-${RELEASE_VERSION}-macOS-${ARCH}.app.zip" ]] || { echo "::error::macOS app zip is empty"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ra2-macos-${{ matrix.arch }}
          path: redalert2/release-assets/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x64 packages
    needs: [prepare, validate]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: redalert2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install Linux/Tauri packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libayatana-appindicator3-dev libfuse2 librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf rpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('redalert2/bun.lock') }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo and compiled Linux target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            redalert2/src-tauri/target
          key: cargo-linux-x64-${{ hashFiles('redalert2/src-tauri/Cargo.lock') }}
          restore-keys: cargo-linux-x64-

      - run: bun install --frozen-lockfile

      - name: Download validated frontend
        uses: actions/download-artifact@v4
        with:
          name: release-web-dist
          path: redalert2/dist

      - name: Build AppImage, DEB and RPM in one compile
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bun run tauri:build -- --config ../.github/tauri-ci.conf.json --ci --bundles appimage,deb,rpm

      - name: Collect Linux artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APPIMAGE="$(find src-tauri/target/release/bundle -type f -name '*.AppImage' -print -quit)"
          DEB="$(find src-tauri/target/release/bundle -type f -name '*.deb' -print -quit)"
          RPM="$(find src-tauri/target/release/bundle -type f -name '*.rpm' -print -quit)"
          [[ -f "$APPIMAGE" ]] || { echo "::error::AppImage missing"; exit 1; }
          [[ -f "$DEB" ]] || { echo "::error::DEB missing"; exit 1; }
          [[ -f "$RPM" ]] || { echo "::error::RPM missing"; exit 1; }
          [[ -s "$APPIMAGE" && -s "$DEB" && -s "$RPM" ]] || { echo "::error::Linux package is empty"; exit 1; }
          file "$APPIMAGE" | grep -Eiq 'x86-64|amd64' || { echo "::error::AppImage is not x86-64"; exit 1; }
          dpkg-deb --info "$DEB" >/dev/null
          rpm -qip "$RPM" >/dev/null
          cp "$APPIMAGE" "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64.AppImage"
          cp "$DEB" "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64.deb"
          cp "$RPM" "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64.rpm"
          BINARY="src-tauri/target/release/redalert2-desktop"
          [[ -x "$BINARY" ]] || { echo "::error::Linux binary missing"; exit 1; }
          file "$BINARY" | grep -Eiq 'ELF 64-bit.*x86-64' || { echo "::error::Linux binary is not x86-64"; exit 1; }
          cp "$BINARY" "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64"
          chmod +x "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64"
          tar -C release-assets -czf "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64.tar.gz" "Red-Alert-2-${RELEASE_VERSION}-linux-x64"
          rm "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64"
          tar -tzf "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64.tar.gz" | grep -Fq "Red-Alert-2-${RELEASE_VERSION}-linux-x64"

      - uses: actions/upload-artifact@v4
        with:
          name: ra2-linux-x64
          path: redalert2/release-assets/*
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: SHA-256 manifest
    needs: [prepare, android, windows, macos, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ra2-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish_release }}
        run: |
          set -euo pipefail
          cd release-assets
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            ANDROID_ARTIFACT="Red-Alert-2-${RELEASE_VERSION}-android.apk"
          else
            ANDROID_ARTIFACT="Red-Alert-2-${RELEASE_VERSION}-DEVELOPMENT-${GITHUB_RUN_NUMBER}-android.apk"
          fi
          required=(
            "$ANDROID_ARTIFACT"
            "Red-Alert-2-${RELEASE_VERSION}-windows-x64-portable.exe"
            "Red-Alert-2-${RELEASE_VERSION}-windows-x64-setup.exe"
            "Red-Alert-2-${RELEASE_VERSION}-macOS-arm64.dmg"
            "Red-Alert-2-${RELEASE_VERSION}-macOS-arm64.app.zip"
            "Red-Alert-2-${RELEASE_VERSION}-macOS-x86_64.dmg"
            "Red-Alert-2-${RELEASE_VERSION}-macOS-x86_64.app.zip"
            "Red-Alert-2-${RELEASE_VERSION}-linux-x64.AppImage"
            "Red-Alert-2-${RELEASE_VERSION}-linux-x64.deb"
            "Red-Alert-2-${RELEASE_VERSION}-linux-x64.rpm"
            "Red-Alert-2-${RELEASE_VERSION}-linux-x64.tar.gz"
          )
          for artifact in "${required[@]}"; do
            [[ -s "$artifact" ]] || { echo "::error::Missing release artifact $artifact"; exit 1; }
          done
          [[ "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#required[@]}" ]] || { echo "::error::Unexpected release artifact count"; exit 1; }
          for artifact in "${required[@]}"; do
            sha256sum "$artifact"
          done > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ra2-checksums
          path: release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [prepare, checksums]
    if: needs.prepare.outputs.publish_release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ra2-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          cat > "$NOTES" <<'NOTES'
          Cross-platform Red Alert 2 / Yuri's Revenge engine build.

          Includes Android APK, Windows portable/setup EXEs, Linux AppImage/DEB/RPM/portable archive, Intel and Apple Silicon macOS DMGs/app zips, and SHA-256 checksums.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            args=(release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Red Alert 2 $VERSION" --notes-file "$NOTES")
            [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
            gh "${args[@]}"
          else
            args=(release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Red Alert 2 $VERSION" --notes-file "$NOTES")
            [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
            gh "${args[@]}"
          fi

          mapfile -d '' ASSETS < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
