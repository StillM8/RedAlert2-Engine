name: Build Red Alert 2 all platforms

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or SHA to build
        required: true
        type: string
        default: beta
      publish_release:
        description: Publish/update a GitHub Release after building
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark a manually published GitHub Release as a prerelease
        required: false
        type: boolean
        default: true
  push:
    branches:
      - beta
    paths:
      - .github/workflows/release.yml
    tags:
      - "ra2-v*"
      - "engine-v*"

permissions:
  contents: read

concurrency:
  group: ra2-all-platforms-${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.10"

jobs:
  prepare:
    name: Resolve build source
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish_release: ${{ steps.release.outputs.publish_release }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
          fetch-depth: 0

      - id: release
        name: Resolve version and publishing mode
        shell: bash
        env:
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
          MANUAL_PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("redalert2/src-tauri/tauri.conf.json"))["version"])')"
          SOURCE_SHA="$(git rev-parse HEAD)"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" != "ra2-v${VERSION}" && "$TAG" != "engine-v${VERSION}" ]]; then
              echo "::error::Tag $TAG does not match engine version $VERSION"
              exit 1
            fi
            PUBLISH_RELEASE=true
            if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          else
            TAG="engine-v${VERSION}"
            PUBLISH_RELEASE="${MANUAL_PUBLISH:-false}"
            PRERELEASE="${MANUAL_PRERELEASE:-true}"
            [[ "$VERSION" == *-* ]] && PRERELEASE=true
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Building $SOURCE_SHA as Red Alert 2 $VERSION"

  validate:
    name: Test and validate engine
    needs: prepare
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: redalert2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Full test suite
        run: bun test
      - name: Production web build
        run: bun run build
      - name: Entry typecheck
        run: bun run typecheck:entry

  android:
    name: Android APK
    needs: [prepare, validate]
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install web dependencies
        working-directory: redalert2
        run: bun install --frozen-lockfile

      - name: Configure Android build version and signer
        id: android-config
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if [[ "$configured" -ne 0 && "$configured" -ne 4 ]]; then
            echo "::error::Android signing secrets are partially configured. Set all four ANDROID_RELEASE_* secrets or remove them all."
            exit 1
          fi

          export PROD_SIGNING="$configured"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          text = p.read_text()
          text = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {os.environ["GITHUB_RUN_NUMBER"]}', text, count=1)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{os.environ["RELEASE_VERSION"]}"', text, count=1)
          if os.environ['PROD_SIGNING'] == '4':
              text = text.replace('            signingConfig = signingConfigs.getByName("betaDev")\n', '')
          p.write_text(text)
          PY

          if [[ "$configured" -eq 4 ]]; then
            echo "mode=production" >> "$GITHUB_OUTPUT"
          else
            echo "mode=beta" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Android WebView assets
        working-directory: redalert2
        run: bun run build

      - name: Stage Android WebView assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/WebDist
          mkdir -p android/app/src/main/assets
          cp -R redalert2/dist android/app/src/main/assets/WebDist
          rm -rf android/app/src/main/assets/GameRes
          mkdir -p android/app/src/main/assets/GameRes

      - name: Assemble release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Package and verify installable APK
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SIGNING_MODE: ${{ steps.android-config.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          SIGNED="android/app/build/outputs/apk/release/app-release.apk"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="release-assets/Red-Alert-2-${RELEASE_VERSION}-android.apk"

          if [[ "$SIGNING_MODE" == "production" ]]; then
            [[ -f "$UNSIGNED" ]] || { echo "::error::Expected unsigned production APK at $UNSIGNED"; exit 1; }
            KEYSTORE="$RUNNER_TEMP/ra2-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            ALIGNED="$RUNNER_TEMP/ra2-aligned.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "$OUTPUT" "$ALIGNED"
          elif [[ -f "$SIGNED" ]]; then
            cp "$SIGNED" "$OUTPUT"
          elif [[ -f "$UNSIGNED" && -f android/beta-debug.keystore ]]; then
            ALIGNED="$RUNNER_TEMP/ra2-beta-aligned.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign \
              --ks android/beta-debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUTPUT" "$ALIGNED"
          elif [[ -f "$UNSIGNED" ]]; then
            KEYSTORE="$RUNNER_TEMP/ra2-temporary-dev.keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" -storepass android -keypass android \
              -alias ra2-dev -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Red Alert 2 Development Build,O=StillM8,C=PK"
            ALIGNED="$RUNNER_TEMP/ra2-temp-aligned.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" --ks-key-alias ra2-dev \
              --ks-pass pass:android --key-pass pass:android \
              --out "$OUTPUT" "$ALIGNED"
          else
            echo "::error::Gradle did not produce a release APK"
            find android/app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT"
          test -s "$OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ra2-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64 EXEs
    needs: [prepare, validate]
    runs-on: windows-2025
    defaults:
      run:
        working-directory: redalert2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: bun install --frozen-lockfile
      - name: Build portable executable and NSIS installer
        run: bun run tauri:build -- --target x86_64-pc-windows-msvc --ci --bundles nsis
      - name: Collect Windows executables
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $portable = "src-tauri/target/x86_64-pc-windows-msvc/release/redalert2-desktop.exe"
          $installer = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter *.exe -File | Select-Object -First 1
          if (-not (Test-Path $portable)) { throw "Expected portable Windows executable not found: $portable" }
          if (-not $installer) { throw "Expected NSIS setup executable was not produced" }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $portable "release-assets/Red-Alert-2-$env:RELEASE_VERSION-windows-x64-portable.exe"
          Copy-Item $installer.FullName "release-assets/Red-Alert-2-$env:RELEASE_VERSION-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ra2-windows-x64
          path: redalert2/release-assets/*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.arch }} DMG + App
    needs: [prepare, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: redalert2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - name: Configure ad-hoc macOS signing
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('src-tauri/tauri.conf.json')
          cfg = json.loads(p.read_text())
          cfg.setdefault('bundle', {}).setdefault('macOS', {})['signingIdentity'] = '-'
          p.write_text(json.dumps(cfg, indent=2) + '\n')
          PY
      - name: Build DMG and application bundle
        run: bun run tauri:build -- --target ${{ matrix.target }} --ci --bundles app,dmg
      - name: Verify and collect macOS artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          DMG="$(find "src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          APP="$(find "src-tauri/target/$TARGET/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -f "$DMG" ]] || { echo "::error::macOS DMG missing"; exit 1; }
          [[ -d "$APP" ]] || { echo "::error::macOS app bundle missing"; exit 1; }
          codesign --verify --deep --strict "$APP"
          cp "$DMG" "release-assets/Red-Alert-2-${RELEASE_VERSION}-macOS-${ARCH}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-assets/Red-Alert-2-${RELEASE_VERSION}-macOS-${ARCH}.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ra2-macos-${{ matrix.arch }}
          path: redalert2/release-assets/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x64 packages
    needs: [prepare, validate]
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: redalert2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: Install Linux/Tauri packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libfuse2 \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf rpm wget xdg-utils
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: Build AppImage, DEB and RPM
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bun run tauri:build -- --ci --bundles appimage,deb,rpm
      - name: Collect Linux artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APPIMAGE="$(find src-tauri/target/release/bundle -type f -name '*.AppImage' -print -quit)"
          DEB="$(find src-tauri/target/release/bundle -type f -name '*.deb' -print -quit)"
          RPM="$(find src-tauri/target/release/bundle -type f -name '*.rpm' -print -quit)"
          BINARY="src-tauri/target/release/redalert2-desktop"
          [[ -f "$APPIMAGE" ]] || { echo "::error::AppImage missing"; exit 1; }
          [[ -f "$DEB" ]] || { echo "::error::DEB missing"; exit 1; }
          [[ -f "$RPM" ]] || { echo "::error::RPM missing"; exit 1; }
          [[ -x "$BINARY" ]] || { echo "::error::Linux portable binary missing"; exit 1; }
          cp "$APPIMAGE" "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64.AppImage"
          cp "$DEB" "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64.deb"
          cp "$RPM" "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64.rpm"
          cp "$BINARY" "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64"
          chmod +x "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64"
          tar -C release-assets -czf "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64.tar.gz" "Red-Alert-2-${RELEASE_VERSION}-linux-x64"
          rm "release-assets/Red-Alert-2-${RELEASE_VERSION}-linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: ra2-linux-x64
          path: redalert2/release-assets/*
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: SHA-256 manifest
    needs: [prepare, android, windows, macos, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ra2-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ra2-checksums
          path: release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: needs.prepare.outputs.publish_release == 'true'
    needs: [prepare, validate, android, windows, macos, linux, checksums]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ra2-*
          path: release-assets
          merge-multiple: true
      - name: Publish or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<NOTES
          Cross-platform Red Alert 2 / Yuri's Revenge engine build.

          Source commit: \`$SOURCE_SHA\`

          Included artifacts:
          - Android installable APK
          - Windows x64 portable EXE and NSIS setup EXE
          - Linux x64 AppImage, DEB, RPM, and portable tar.gz
          - macOS Apple Silicon (arm64) DMG and app bundle ZIP
          - macOS Intel (x64) DMG and app bundle ZIP
          - SHA256SUMS.txt

          Beta macOS builds use an ad-hoc signature and are not Apple-notarized. Windows beta artifacts are not Authenticode-signed. Android uses configured production signing credentials when all four ANDROID_RELEASE_* secrets are present; otherwise the beta tree's stable fake/dev signer is used when available.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Red Alert 2 $VERSION" --notes-file "$NOTES"
          else
            args=(release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Red Alert 2 $VERSION" --notes-file "$NOTES")
            [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
            gh "${args[@]}"
          fi
          mapfile -d '' ASSETS < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
