name: Monitor Ares beta closure

on:
  push:
    branches:
      - beta
    paths:
      - .github/ares-beta-monitor.txt

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Record latest Ares closure run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ares-beta-closure.yml --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "$RUN_ID" ]]; then
            printf '{"status":"no-run-found"}\n' > .github/ares-beta-run-status.json
          else
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url,headSha,event,createdAt,updatedAt > .github/ares-beta-run-status.json
          fi
      - name: Commit monitor status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ares-beta-run-status.json
          git commit -m "Record Ares beta closure run" || exit 0
          git pull --rebase origin beta
          git push origin HEAD:beta
