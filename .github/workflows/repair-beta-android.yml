name: Repair beta Android branding and signing

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/repair-beta-android.yml

permissions:
  contents: write

jobs:
  repair-build-verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Apply RA2/YR branding and beta signing
        shell: bash
        run: |
          set -euo pipefail

          # Restore the repository's previous RA2/YR Android branding assets,
          # not the later generic/custom Open RTS Engine launcher artwork.
          git show 6d2159c3d433235394828be121b3bc764d9746d3:android/app/src/main/AndroidManifest.xml > android/app/src/main/AndroidManifest.xml
          git show 6d2159c3d433235394828be121b3bc764d9746d3:android/app/src/main/java/io/stillm8/rtsengine/IconSwitchActivity.kt > android/app/src/main/java/io/stillm8/rtsengine/IconSwitchActivity.kt
          git show 6d2159c3d433235394828be121b3bc764d9746d3:android/app/src/main/res/values/strings.xml > android/app/src/main/res/values/strings.xml
          git show 6d2159c3d433235394828be121b3bc764d9746d3:android/app/src/main/res/drawable/app_icon_ra2.png > android/app/src/main/res/drawable/app_icon_ra2.png
          git show 6d2159c3d433235394828be121b3bc764d9746d3:android/app/src/main/res/drawable/app_icon_yr.xml > android/app/src/main/res/drawable/app_icon_yr.xml
          cp android/app/src/main/res/drawable/app_icon_ra2.png android/app/src/main/res/drawable/app_icon.png

          cat > redalert2/src/shell/androidLauncherIcon.ts <<'EOF'
          /** Keep Android's launcher icon aligned with the selected runtime profile. */
          export function syncAndroidLauncherIcon(runtimeProfile: string): void {
              if (typeof window === 'undefined') return;
              const params = new URLSearchParams(window.location.search);
              if (params.get('platform') !== 'android') return;

              // ContentRegistry treats every non-RA2 runtime profile as YR-based.
              const profile = runtimeProfile === 'ra2' ? 'ra2' : 'yr';
              const link = document.createElement('a');
              link.href = `ra2launcher://${profile}`;
              link.style.display = 'none';
              document.body.appendChild(link);
              link.click();
              link.remove();
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Patch anchor missing in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once('android/settings.gradle.kts',
                       'rootProject.name = "OpenRTSEngineAndroid"',
                       'rootProject.name = "RedAlert2EngineAndroid"')

          # Preserve the current keyboard behavior that post-dates the historical manifest.
          replace_once('android/app/src/main/AndroidManifest.xml',
                       'android:screenOrientation="landscape" />',
                       'android:screenOrientation="landscape"\n            android:windowSoftInputMode="adjustNothing" />')

          p = Path('android/app/build.gradle.kts')
          text = p.read_text()
          if 'create("betaDev")' not in text:
              anchor = '    buildTypes {\n'
              signing = '''    signingConfigs {\n        create("betaDev") {\n            storeFile = rootProject.file("beta-debug.keystore")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n\n'''
              if anchor not in text:
                  raise SystemExit('Android buildTypes anchor missing')
              text = text.replace(anchor, signing + anchor, 1)
          if 'signingConfig = signingConfigs.getByName("betaDev")' not in text:
              old = '''        release {\n            isMinifyEnabled = false\n            manifestPlaceholders["allowCleartext"] = "false"\n        }'''
              new = '''        release {\n            isMinifyEnabled = false\n            signingConfig = signingConfigs.getByName("betaDev")\n            manifestPlaceholders["allowCleartext"] = "false"\n        }'''
              if old not in text:
                  raise SystemExit('Android release block anchor missing')
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('redalert2/src/Application.ts')
          text = p.read_text()
          import_line = "import { syncAndroidLauncherIcon } from './shell/androidLauncherIcon';\n"
          if import_line not in text:
              anchor = "import { isNativeShell, isTauriDesktopShell } from './shell/nativeShell';\n"
              if anchor not in text:
                  raise SystemExit('Application native-shell import anchor missing')
              text = text.replace(anchor, anchor + import_line, 1)
          call = '        syncAndroidLauncherIcon(contentSelection.profileId);\n'
          if call not in text:
              anchor = '        const profile = contentSelection.profileId;\n'
              if anchor not in text:
                  raise SystemExit('Application content-selection anchor missing')
              text = text.replace(anchor, anchor + call, 1)
          p.write_text(text)

          p = Path('android/app/src/main/java/io/stillm8/rtsengine/MainActivity.kt')
          text = p.read_text().replace('OpenRTSEngine-Android/0.1', 'RedAlert2Engine-Android/0.1')
          p.write_text(text)

          p = Path('redalert2/src-tauri/tauri.conf.json')
          cfg = json.loads(p.read_text())
          cfg['productName'] = 'Red Alert 2'
          cfg['app']['windows'][0]['title'] = 'Red Alert 2'
          cfg['bundle']['shortDescription'] = "A cross-platform Red Alert 2 and Yuri's Revenge engine"
          cfg['bundle']['longDescription'] = "A cross-platform TypeScript and WebGL engine for user-provided Red Alert 2, Yuri's Revenge, and compatible mod content."
          p.write_text(json.dumps(cfg, indent=2) + '\n')
          PY

          if [[ ! -f android/beta-debug.keystore ]]; then
            keytool -genkeypair \
              -keystore android/beta-debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Red Alert 2 Beta Dev,O=StillM8,C=PK" \
              -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install web dependencies
        working-directory: redalert2
        run: bun install --frozen-lockfile

      - name: Run full engine and Ares tests
        working-directory: redalert2
        run: bun test

      - name: Production web build
        working-directory: redalert2
        run: bun run build

      - name: Entry typecheck
        working-directory: redalert2
        run: bun run typecheck:entry

      - name: Stage WebView assets
        run: |
          rm -rf android/app/src/main/assets/WebDist
          cp -R redalert2/dist android/app/src/main/assets/WebDist
          mkdir -p android/app/src/main/assets/GameRes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build signed beta release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: red-alert-2-beta-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Commit validated Android beta changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-beta-android.yml
          git rm -f .github/workflows/fix-android-repair-hook.yml || true
          git add android redalert2/src/Application.ts redalert2/src/shell/androidLauncherIcon.ts redalert2/src-tauri/tauri.conf.json
          git add -f android/beta-debug.keystore
          git commit -m "Fix Android signing and restore RA2/YR branding"
          git pull --rebase origin beta
          git push origin HEAD:beta
