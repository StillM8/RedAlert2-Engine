name: Monitor RA2 branding migration

on:
  push:
    branches: [main]
    paths:
      - .github/monitor-ra2-branding.txt

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 5
          gh run list --repo "$GITHUB_REPOSITORY" --workflow apply-ra2-branding.yml --limit 5 --json databaseId,status,conclusion,event,headSha,createdAt,url > .github/ra2-branding-runs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ra2-branding-runs.json
          git commit -m "Record RA2 branding migration runs" || exit 0
          git push origin HEAD:main
