name: Trigger engine release

on:
  push:
    branches:
      - main
    paths:
      - .github/release-trigger.txt

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch release workflow
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger release.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f prerelease=true
