name: Pull request checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.10"

jobs:
  web-typecheck:
    name: web / typecheck
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: redalert2
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript entry check
        run: bun run typecheck:entry
      - name: Job summary
        if: always()
        run: |
          {
            echo "### web / typecheck"
            echo "- SHA: \`${{ github.sha }}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  web-tests:
    name: web / tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: redalert2
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit and compatibility tests
        run: bun test
      - name: Job summary
        if: always()
        run: |
          {
            echo "### web / tests"
            echo "- SHA: \`${{ github.sha }}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  determinism:
    name: determinism / qualification
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: redalert2
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run deterministic qualification suite
        run: >-
          bun test
          src/test/game/CanonicalStateCoverage.test.ts
          src/test/game/CountdownTimerDeterminism.test.ts
          src/test/game/DeterministicRestoreQualification.test.ts
          src/test/game/PlayerHashCoverage.test.ts
          src/test/game/PlayerIdentity.test.ts
          src/test/game/Prng.test.ts
          src/test/game/ProductionQueueDeterminism.test.ts
          src/test/game/SuperWeaponStateHash.test.ts
          src/test/game/TransportDeterminism.test.ts
          src/test/compatibility/AresAnimationDamageRuntimeDeterminism.test.ts
          src/test/compatibility/AresAttachEffectIdentity.test.ts
          src/test/compatibility/AresAttachEffectRestoreDeterminism.test.ts
      - name: Job summary
        if: always()
        run: |
          {
            echo "### determinism / qualification"
            echo "- SHA: \`${{ github.sha }}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  web-production-build:
    name: web / production-build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: redalert2
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web engine
        run: bun run build
      - name: Validate production artifact
        run: test -s dist/index.html
      - name: Upload validated WebView assets
        uses: actions/upload-artifact@v4
        with:
          name: ci-web-dist
          path: redalert2/dist
          if-no-files-found: error
          retention-days: 1
      - name: Job summary
        if: always()
        run: |
          {
            echo "### web / production-build"
            echo "- SHA: \`${{ github.sha }}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  android-compile:
    name: android / compile
    needs: web-production-build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download validated WebView assets
        uses: actions/download-artifact@v4
        with:
          name: ci-web-dist
          path: redalert2/dist
      - name: Stage engine-only WebView assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/WebDist
          mkdir -p android/app/src/main/assets
          cp -R redalert2/dist android/app/src/main/assets/WebDist
          rm -rf android/app/src/main/assets/GameRes
          mkdir -p android/app/src/main/assets/GameRes
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Compile and lint debug application
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug
      - name: Job summary
        if: always()
        run: |
          {
            echo "### android / compile"
            echo "- SHA: \`${{ github.sha }}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  desktop-tauri-check:
    name: desktop / tauri-check
    needs: web-production-build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download validated WebView assets
        uses: actions/download-artifact@v4
        with:
          name: ci-web-dist
          path: redalert2/dist
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check Tauri backend
        working-directory: redalert2/src-tauri
        run: cargo check --locked
      - name: Job summary
        if: always()
        run: |
          {
            echo "### desktop / tauri-check"
            echo "- SHA: \`${{ github.sha }}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  ios-simulator-build:
    name: ios / simulator-build
    needs: web-production-build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RA2_APP_NAME: Open RTS Engine
      RA2_BUNDLE_ID: io.stillm8.openrtsengine.ci
      RA2_TEAM_ID: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download validated WebView assets
        uses: actions/download-artifact@v4
        with:
          name: ci-web-dist
          path: redalert2/dist
      - name: Stage engine-only WebView assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios/Resources/WebDist
          mkdir -p ios/Resources/WebDist
          cp -R redalert2/dist/. ios/Resources/WebDist
          rm -rf ios/Resources/GameRes
          mkdir -p ios/Resources/GameRes
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build iOS Simulator target
        run: >-
          xcodebuild
          -project ios/RA2.xcodeproj
          -scheme RA2
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Job summary
        if: always()
        run: |
          {
            echo "### ios / simulator-build"
            echo "- SHA: \`${{ github.sha }}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
