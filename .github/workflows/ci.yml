name: Build and test

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - ".github/ares-beta-trigger.txt"
      - ".github/ares-beta-inspect.txt"
      - ".github/ares-beta-inspect-status.json"
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.10"

jobs:
  web:
    name: Web tests and production build
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: redalert2
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('redalert2/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and compatibility tests
        run: bun test

      - name: Build web engine
        run: bun run build

      - name: TypeScript entry check
        run: bun run typecheck:entry

      - name: Upload validated WebView assets
        uses: actions/upload-artifact@v4
        with:
          name: ci-web-dist
          path: redalert2/dist
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android debug build
    if: github.actor != 'github-actions[bot]'
    needs: web
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download validated WebView assets
        uses: actions/download-artifact@v4
        with:
          name: ci-web-dist
          path: redalert2/dist

      - name: Stage engine-only WebView assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/WebDist
          mkdir -p android/app/src/main/assets
          cp -R redalert2/dist android/app/src/main/assets/WebDist
          rm -rf android/app/src/main/assets/GameRes
          mkdir -p android/app/src/main/assets/GameRes

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compile shared debug application
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
