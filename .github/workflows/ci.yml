name: Build and test

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: redalert2
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and compatibility tests
        run: bun test

      - name: Build web engine
        run: bun run build

      # The current entry tsconfig still includes unrelated legacy developer
      # tools with pre-existing errors. Keep this visible while the migration
      # is completed; tests and the production build remain blocking gates.
      - name: TypeScript entry check (informational)
        run: bun run typecheck:entry
        continue-on-error: true

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install web dependencies
        working-directory: redalert2
        run: bun install --frozen-lockfile

      - name: Build web engine
        working-directory: redalert2
        run: bun run build

      - name: Stage engine-only WebView assets
        shell: bash
        run: |
          rm -rf android/app/src/main/assets/WebDist
          cp -R redalert2/dist android/app/src/main/assets/WebDist
          mkdir -p android/app/src/main/assets/GameRes

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Runtime RA2/YR/MO selection replaced the old Android product flavors.
      # There is now one shell APK, so assemble the shared debug application.
      - name: Compile shared debug application
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
