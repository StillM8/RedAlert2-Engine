name: Fix Android repair profile hook

on:
  push:
    branches:
      - beta
    paths:
      - .github/workflows/fix-android-repair-hook.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Patch profile-aware icon sync and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/repair-beta-android.yml')
          text = p.read_text()
          replacements = {
              'export function syncAndroidLauncherIcon(baseProfile: string): void {': 'export function syncAndroidLauncherIcon(runtimeProfile: string): void {',
              "const profile = baseProfile === 'yr' ? 'yr' : 'ra2';": "const profile = runtimeProfile === 'ra2' ? 'ra2' : 'yr';",
              'syncAndroidLauncherIcon(contentSelection.baseProfile);': 'syncAndroidLauncherIcon(contentSelection.profileId);',
          }
          for old, new in replacements.items():
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Missing Android repair hook anchor: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-android-repair-hook.yml
          git add .github/workflows/repair-beta-android.yml
          git commit -m "Fix Android launcher profile selection"
          git pull --rebase origin beta
          git push origin HEAD:beta
