name: Apply Ares beta closure batch

on:
  push:
    branches:
      - beta
    paths:
      - scripts/ares-beta-closure-3.py
      - .github/ares-beta-trigger.txt

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Apply guarded Ares runtime patch
        run: python3 scripts/ares-beta-closure-3.py

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        working-directory: redalert2
        run: bun install --frozen-lockfile

      - name: Run full tests
        working-directory: redalert2
        run: bun test

      - name: Build production web engine
        working-directory: redalert2
        run: bun run build

      - name: Entry typecheck
        working-directory: redalert2
        run: bun run typecheck:entry

      - name: Commit validated runtime batch to beta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add redalert2/src
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "Implement Ares custom missile runtime"
          git pull --rebase origin beta
          git push origin HEAD:beta
