name: Apply Ares beta closure batch

on:
  push:
    branches:
      - beta
    paths:
      - scripts/ares-beta-closure-2.py
      - .github/ares-beta-trigger.txt

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Make guarded patch idempotent on an advancing beta tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ares-beta-closure-2.py")
          text = path.read_text()
          old = '''    actual = text.count(old)\n    if actual < count:\n        raise RuntimeError(f"{path}: expected at least {count} occurrence(s), found {actual}: {old[:140]!r}")\n    file.write_text(text.replace(old, new, count))\n'''
          new = '''    # Many closure insertions intentionally retain their anchor as part of the\n    # replacement.  Test for the exact intended result first so a rerun never\n    # duplicates an import, interface, field, or function.\n    if new in text:\n        return\n    actual = text.count(old)\n    if actual < count:\n        raise RuntimeError(f"{path}: expected old or already-applied new form; found {actual} old occurrence(s): {old[:140]!r}")\n    file.write_text(text.replace(old, new, count))\n'''
          previous = '''    actual = text.count(old)\n    if actual < count:\n        # The beta branch is intentionally moving while closure batches land.\n        # If the exact intended replacement is already present, this patch has\n        # already been applied and is safe to skip.  Any third state still fails\n        # loudly so an unrelated refactor cannot be mistaken for compatibility.\n        if new in text:\n            return\n        raise RuntimeError(f"{path}: expected old or already-applied new form; found {actual} old occurrence(s): {old[:140]!r}")\n    file.write_text(text.replace(old, new, count))\n'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif previous in text:
              path.write_text(text.replace(previous, new, 1))
          elif new not in text:
              raise SystemExit("Could not locate guarded replace helper")
          PY

      - name: Apply guarded Ares runtime patch
        run: python3 scripts/ares-beta-closure-2.py

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        working-directory: redalert2
        run: bun install --frozen-lockfile

      - name: Run full tests
        working-directory: redalert2
        run: bun test

      - name: Build production web engine
        working-directory: redalert2
        run: bun run build

      - name: Entry typecheck
        working-directory: redalert2
        run: bun run typecheck:entry

      - name: Commit validated runtime batch to beta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add redalert2/src
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "Complete Ares parachute and projectile animation runtime"
          git pull --rebase origin beta
          git push origin HEAD:beta
