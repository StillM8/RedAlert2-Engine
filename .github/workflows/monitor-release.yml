name: Monitor engine release

on:
  push:
    branches:
      - main
    paths:
      - .github/release-monitor.txt

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    name: Monitor latest engine release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find and watch latest release run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 10
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "$RUN_ID" ]]; then
            printf '{"status":"no-run-found"}\n' > .github/release-run-status.json
          else
            gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --interval 10 --exit-status || true
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url,headSha,event,createdAt,updatedAt > .github/release-run-status.json
          fi

      - name: Commit release run status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-run-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record engine release run status"
          git push origin HEAD:main
