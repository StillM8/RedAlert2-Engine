name: RA2
options:
  bundleIdPrefix: io.stillm8
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ${RA2_TEAM_ID}
targets:
  RA2:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
      - path: Resources/WebDist
        type: folder
        buildPhase: resources
      - path: Resources/GameRes
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ${RA2_APP_NAME}
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # Debug-log forwarding to a dev machine on the LAN (see iosSeed.ts).
        # iOS gates cleartext + local-network access; both must be declared.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Forwards diagnostic logs to a development machine during testing.
        UILaunchStoryboardName: ""
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    # NOTE: com.apple.developer.kernel.increased-memory-limit (Sources/
    # RA2.entitlements) is prepared but not wired: the team's automatic
    # provisioning profile lacks the capability. Enable "Increased Memory
    # Limit" for the App ID in the developer portal, then re-add:
    #   entitlements: { path: Sources/RA2.entitlements }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${RA2_BUNDLE_ID}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        CODE_SIGN_STYLE: Automatic
